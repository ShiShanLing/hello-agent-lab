[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-agent-lab"
version = "0.1.0"
description = "AI Agent 入门练习：最小命令行学习助手"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=45.0.0,<51.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "fastembed==0.8.0",
    "geotool-cn>=2.0.1,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "mcp>=2.0.0,<3.0.0",
    "openai>=1.0.0,<3.0.0",
    "pypinyin>=0.55.0,<1.0.0",
    "pypdf>=5.0.0,<7.0.0",
    "pypdfium2>=4.30.0,<5.0.0",
    "pytesseract>=0.3.10,<1.0.0",
    "Pillow>=10.0.0,<12.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "redis==7.4.1",
    "rq==2.10.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "sqlite-vec==0.1.9",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.scripts]
hello-agent = "hello_agent.app:main"
hello-agent-admin = "hello_agent.admin_cli:main"
hello-agent-knowledge-mcp = "hello_agent.knowledge_mcp_server:main"
hello-agent-reindex-knowledge = "hello_agent.reindex_knowledge:main"
hello-agent-task-worker = "hello_agent.task_worker:main"
hello-agent-weather-mcp = "hello_agent.weather_mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
